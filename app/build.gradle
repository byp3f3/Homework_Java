plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.notification'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.notification"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    implementation 'androidx.room:room-runtime:2.5.2' // или последняя версия
    annotationProcessor 'androidx.room:room-compiler:2.5.2' // или последняя версия
    // optional - RxJava2 support for Room
    implementation 'androidx.room:room-rxjava2:2.5.2'
    // optional - RxJava3 support for Room
    implementation 'androidx.room:room-rxjava3:2.5.2'
    // optional - Guava support for Room
    implementation 'androidx.room:room-guava:2.5.2'
    // optional - Test helpers
    testImplementation 'androidx.room:room-testing:2.5.2'
}